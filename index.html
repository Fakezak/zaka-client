<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaka Project - Free Fire Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        #loading {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        #welcome-message, #enjoy-message {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .main-text {
            color: #ff0000;
        }

        .emoji {
            color: #00ff00;
        }

        #enjoy-message {
            font-size: 3rem;
            background: linear-gradient(45deg, #ff0000, #00ff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #authenticated-state {
            text-align: left;
            animation: fadeIn 1s ease-in;
        }

        .success-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .token-display {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .error-message {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 20px;
            text-align: center;
            border: 1px solid #ff4444;
        }

        #debug-info {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-size: 0.8rem;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Connecting to Zaka servers...</p>
        </div>

        <div id="welcome-message" class="hidden">
            <span class="main-text" id="welcome-text"></span>
            <span class="emoji">:)</span>
        </div>

        <div id="enjoy-message" class="hidden">
            Enjoy <span class="emoji">:)</span>
        </div>

        <div id="authenticated-state" class="hidden">
            <span class="success-badge">✓ Authenticated</span>
            <h2>Zaka Project</h2>
            <div class="user-info">
                <div class="info-item">
                    <strong>Account ID:</strong><br>
                    <span id="account-id"></span>
                </div>
                <div class="info-item">
                    <strong>Request ID:</strong><br>
                    <span id="request-id"></span>
                </div>
                <div class="info-item">
                    <strong>Session Expires:</strong><br>
                    <span id="session-expiry"></span>
                </div>
                <div class="token-display">
                    <strong>Session Token:</strong><br>
                    <span id="session-token"></span>
                </div>
            </div>
        </div>

        <div id="error-container" class="error-message hidden"></div>
        <div id="debug-info"></div>
    </div>

    <script>
        // Client configuration
        const CLIENT_CONFIG = {
            clientId: 'zaka-ff-client-v1',
            clientSecret: 'zaka_ff_2024_secure_key',
            platform: 'freefire',
            version: '1.0.0',
            // Use relative URL - will work on Vercel deployment
            apiEndpoint: '/api/auth/session',
            signatureHeader: 'x-zaka-signature',
            timestampHeader: 'x-zaka-timestamp',
            nonceHeader: 'x-zaka-nonce'
        };

        // Debug function
        function debugLog(message) {
            console.log(message);
            const debugElement = document.getElementById('debug-info');
            if (debugElement) {
                debugElement.innerHTML += message + '<br>';
            }
        }

        // Generate secure random nonce
        function generateNonce() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
        }

        // Generate UUID v4 (client-side)
        function generateUUID() {
            if (crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Generate HMAC signature
        async function generateSignature(method, url, timestamp, nonce, body) {
            const payload = `${method}${url}${timestamp}${nonce}${JSON.stringify(body)}`;
            
            debugLog(`Generating signature for payload: ${payload}`);
            
            const encoder = new TextEncoder();
            const keyData = encoder.encode(CLIENT_CONFIG.clientSecret);
            const payloadData = encoder.encode(payload);
            
            try {
                const key = await crypto.subtle.importKey(
                    'raw',
                    keyData,
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                
                const signature = await crypto.subtle.sign(
                    'HMAC',
                    key,
                    payloadData
                );
                
                return Array.from(new Uint8Array(signature))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
            } catch (error) {
                debugLog(`Signature generation error: ${error.message}`);
                throw error;
            }
        }

        // Get account_id from URL parameters or localStorage
        function getAccountId() {
            const urlParams = new URLSearchParams(window.location.search);
            const accountId = urlParams.get('account_id') || localStorage.getItem('zaka_account_id');
            
            if (accountId) {
                localStorage.setItem('zaka_account_id', accountId);
                return accountId;
            }
            
            // For demo purposes, generate a random account ID
            const demoAccountId = 'FF_' + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('zaka_account_id', demoAccountId);
            return demoAccountId;
        }

        // Authenticate with Zaka server
        async function authenticateWithZaka() {
            const accountId = getAccountId();
            const requestId = generateUUID();
            const timestamp = Date.now();
            const nonce = generateNonce();
            
            debugLog(`Authenticating with account: ${accountId}`);
            debugLog(`Request ID: ${requestId}`);
            debugLog(`Timestamp: ${timestamp}`);
            
            const requestBody = {
                request_id: requestId,
                account_id: accountId,
                platform: CLIENT_CONFIG.platform,
                client_version: CLIENT_CONFIG.version
            };

            // Build the full URL
            const fullUrl = window.location.origin + CLIENT_CONFIG.apiEndpoint;
            debugLog(`API Endpoint: ${fullUrl}`);
            
            // Generate signature
            const signature = await generateSignature(
                'POST',
                CLIENT_CONFIG.apiEndpoint,
                timestamp,
                nonce,
                requestBody
            );
            
            debugLog(`Signature: ${signature.substring(0, 20)}...`);
            
            // Send request to server
            try {
                const response = await fetch(CLIENT_CONFIG.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [CLIENT_CONFIG.signatureHeader]: signature,
                        [CLIENT_CONFIG.timestampHeader]: timestamp.toString(),
                        [CLIENT_CONFIG.nonceHeader]: nonce
                    },
                    body: JSON.stringify(requestBody)
                });

                debugLog(`Response status: ${response.status}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    debugLog(`Error response: ${errorText}`);
                    
                    let errorData;
                    try {
                        errorData = JSON.parse(errorText);
                    } catch {
                        errorData = { error: errorText };
                    }
                    
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                debugLog(`Success response: ${JSON.stringify(data)}`);
                
                if (!data.success) {
                    throw new Error('Invalid server response');
                }

                return data.data;
            } catch (error) {
                debugLog(`Fetch error: ${error.message}`);
                throw error;
            }
        }

        // Display welcome message
        function displayWelcomeMessage(sessionData) {
            const loadingElement = document.getElementById('loading');
            const welcomeElement = document.getElementById('welcome-message');
            const welcomeText = document.getElementById('welcome-text');
            
            loadingElement.classList.add('hidden');
            welcomeText.textContent = `Welcome user${sessionData.account_id} to zaka project `;
            welcomeElement.classList.remove('hidden');
            
            debugLog('Displaying welcome message');
            
            // After 5 seconds, transition to "Enjoy :)"
            setTimeout(() => {
                welcomeElement.style.animation = 'fadeOut 0.5s ease-out';
                welcomeElement.style.opacity = '0';
                
                setTimeout(() => {
                    welcomeElement.classList.add('hidden');
                    displayEnjoyMessage(sessionData);
                }, 500);
            }, 5000);
        }

        // Display "Enjoy :)" message
        function displayEnjoyMessage(sessionData) {
            const enjoyElement = document.getElementById('enjoy-message');
            enjoyElement.classList.remove('hidden');
            enjoyElement.style.opacity = '1';
            
            debugLog('Displaying enjoy message');
            
            // After 2 seconds, transition to authenticated state
            setTimeout(() => {
                enjoyElement.style.animation = 'fadeOut 0.5s ease-out';
                enjoyElement.style.opacity = '0';
                
                setTimeout(() => {
                    enjoyElement.classList.add('hidden');
                    displayAuthenticatedState(sessionData);
                }, 500);
            }, 2000);
        }

        // Display authenticated state
        function displayAuthenticatedState(sessionData) {
            const authenticatedElement = document.getElementById('authenticated-state');
            
            document.getElementById('account-id').textContent = sessionData.account_id;
            document.getElementById('request-id').textContent = sessionData.request_id;
            document.getElementById('session-token').textContent = sessionData.session_token;
            document.getElementById('session-expiry').textContent = new Date(Date.now() + (sessionData.expires_in * 1000)).toLocaleString();
            
            authenticatedElement.classList.remove('hidden');
            
            debugLog('Displaying authenticated state');
        }

        // Show error message
        function showError(message) {
            const errorElement = document.getElementById('error-container');
            errorElement.textContent = `Error: ${message}`;
            errorElement.classList.remove('hidden');
            
            const loadingElement = document.getElementById('loading');
            loadingElement.classList.add('hidden');
            
            debugLog(`Error shown: ${message}`);
        }

        // Initialize client
        async function init() {
            try {
                debugLog('Initializing Zaka client...');
                debugLog(`Current URL: ${window.location.href}`);
                
                const sessionData = await authenticateWithZaka();
                displayWelcomeMessage(sessionData);
            } catch (error) {
                console.error('Authentication error:', error);
                showError(error.message);
            }
        }

        // Start the client when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
